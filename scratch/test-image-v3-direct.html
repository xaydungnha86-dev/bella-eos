<!DOCTYPE html>
<html>
<head>
  <title>Test Image v3 Direct</title>
  <meta charset="utf-8">
</head>
<body>
  <h1>Test Creative Intelligence v3 API</h1>
  <button onclick="testImageGen()">Tạo ảnh test</button>
  <div id="result"></div>
  
  <script>
    async function testImageGen() {
      const result = document.getElementById('result');
      result.innerHTML = 'Đang tạo ảnh...';
      
      // Lấy keys từ localStorage
      const keys = JSON.parse(localStorage.getItem('bella_eos_integrations') || '{}');
      const geminiKey = keys.gemini || keys.google;
      
      console.log('Gemini key:', geminiKey ? 'OK ✅' : 'MISSING ❌');
      
      try {
        const res = await fetch('http://localhost:3000/api/ai/generate-image-v3', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            objective: 'Marketing cho spa cao cấp tại Hà Nội',
            copywriterContent: 'SPA CAO CẤP - Trải nghiệm dịch vụ 5 sao',
            client_gemini_key: geminiKey,
            brandDna: {
              brandName: 'BELLA SPA',
              voiceTone: 'Sang trọng, Tinh tế',
              visualStyle: 'Minimalist',
              targetSegment: 'Khách hàng cao cấp',
              brandColors: { primary: '#8B7355', accent: '#D4AF37' }
            },
            format: '16:9'
          })
        });
        
        const data = await res.json();
        console.log('Response:', data);
        
        if (data.success && data.imageUrl) {
          const fullUrl = data.imageUrl.startsWith('http') 
            ? data.imageUrl 
            : `http://localhost:3000${data.imageUrl}`;
          
          result.innerHTML = `
            <h2>✅ Thành công!</h2>
            <p><strong>Provider:</strong> ${data.provider}</p>
            <p><strong>Model:</strong> ${data.model}</p>
            <p><strong>Headline:</strong> ${data.creativeBrief?.headline || 'N/A'}</p>
            <p><strong>Confidence:</strong> ${data.creativeBrief?.confidence || 'N/A'}</p>
            <p><strong>Image URL:</strong> <a href="${fullUrl}" target="_blank">${data.imageUrl}</a></p>
            <img src="${fullUrl}" style="max-width: 800px; border: 2px solid #ccc; margin-top: 10px;">
          `;
        } else {
          result.innerHTML = `<h2>❌ Thất bại</h2><pre>${JSON.stringify(data, null, 2)}</pre>`;
        }
      } catch (e) {
        result.innerHTML = `<h2>❌ Lỗi</h2><pre>${e.message}</pre>`;
        console.error(e);
      }
    }
  </script>
</body>
</html>
